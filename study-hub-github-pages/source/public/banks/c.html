<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقييمات الذاتية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: صفحة تشبه خزانة شبكات (Rack). كل سؤال وحدة 1U بأذنين ومنافذ LED، والإجابة الصحيحة تُضيء بالأخضر. */
:root {

  --rack: #0F2236; --rack-2: #17314C; --rack-ink: #E8EEF5; --rack-mut: #9DB2C7;

    --d-box: #15283C; --d-line: #4A6480;
    --ok: #2BD485; --ok-solid: #14995A; --ok-ink: #5DE3A5; --ok-soft: #0D3A29;
    --acc: #FF9A3D; --acc-ink: #FFB46B; --acc-soft: #38240F; --acc-line: #7C4A1D;
    --blue: #5AA2E6; --bad: #FF6F6F; --bad-soft: #3A1A1D;
    --grid: rgba(180,210,240,.045);

}

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 150px; }

}
.wrap { max-width: 1160px; margin-inline: auto; }

:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; border-radius: 6px; }

.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--rack-mut); margin: 0; direction: ltr; text-align: start; }

/* ===== البطاقات ===== */
.list { display: grid; gap: 22px; margin-top: 22px; }
.u { display: grid; grid-template-columns: 78px minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.ear { background: linear-gradient(180deg, var(--rack-2), var(--rack)); color: var(--rack-ink); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 6px; border-inline-end: 1px solid rgba(255,255,255,.1); position: relative; }
.ear::before, .ear::after { content: ""; position: absolute; inset-inline: 0; margin-inline: auto; width: 10px; height: 10px; border-radius: 50%; background: #0A1623; box-shadow: inset 0 0 0 2px #3A5776; }
.ear::before { top: 8px; } .ear::after { bottom: 8px; }
.ear .no { margin-top: 14px; font-family: var(--f-mono); font-weight: 600; font-size: 22px; letter-spacing: .02em; font-variant-numeric: tabular-nums; direction: ltr; }

.u[data-known="1"] .ear .led { background: #2BD485; box-shadow: 0 0 10px #2BD485; }
.body { padding: 16px clamp(14px, 2.4vw, 24px) 16px; display: grid; gap: 14px; min-width: 0; }
.qh { display: grid; gap: 6px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 18px; align-items: start; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.op { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: start; padding: 9px 12px; border-radius: 10px;
  background: var(--d-box); border: 1px solid var(--line); direction: ltr; transition: border-color .15s, background .15s; }
.op .jack { width: 24px; height: 24px; border-radius: 6px; background: var(--panel); border: 1px solid var(--d-line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--mut); }
.op .tx { font-size: 14px; line-height: 1.45; text-align: left; overflow-wrap: anywhere; }
.op .st { font-size: 11.5px; font-weight: 700; font-family: var(--f-body); direction: rtl; }

.op[disabled] { color: inherit; opacity: 1; cursor: default; }
.rev .op { opacity: .62; }
.rev .op.is-ok { opacity: 1; background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok), 0 0 18px -4px var(--ok); }

.rev .op.is-no { opacity: 1; background: var(--bad-soft); border-color: var(--bad); }

.op.pick { border-color: var(--acc); background: var(--acc-soft); }

.dg { margin: 0; display: grid; gap: 8px; min-width: 0; }
.screen { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 18px 18px; padding: 6px; overflow: hidden; }

.tip { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 11px 14px; border-radius: 10px; background: var(--acc-soft); border: 1px dashed var(--acc-line); }

.why { margin: 0; color: var(--mut); font-size: 14px; }
.why b { color: var(--ink); }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--d-box); border-radius: 9px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: center; }
.btn i { width: 10px; height: 10px; border-radius: 50%; background: var(--d-line); }

.to-top svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.4; }

/* ===== رسومات SVG ===== */
svg .t { font-family: var(--f-body); }

}

<script>window.CFG={"key":"nb-c","q":"Q"};
/* مساعدات بناء الرسوم */
const g = (items, hi, cap) => ({ t: 'grid', items: items.map(([t, d, m]) => ({ t, d, m })), hi, cap });
const ch = (items, hi, cap, title) => ({ t: 'chain', items: items.map(([t, s, m]) => ({ t, s, m })), hi, cap, title });
const ly = (m, hi, cap) => ({ t: 'layers', m, hi, cap });
const cm = (lines, cap, title) => ({ t: 'cmd', lines, cap, title });
const q = (id, topic, o, a, en, ar, tip, why, d) => ({ id, topic, o, a, en, ar, tip, why, d });


/* ===== مولّد الرسوم التوضيحية (SVG) ===== */
const W = 360, H = 200;
const E = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function T(x, y, s, o = {}) {
  const ar = /[\u0600-\u06FF]/.test(s), m = o.m && !ar; let a = o.a || 'middle';
  if (!m && a !== 'middle') a = a === 'end' ? 'start' : 'end'; /* الصفحة RTL: نحوّل المواضع البصرية */
  return `<text x="${x}" y="${y}" class="t ${o.c || 'ink'}${m ? ' mono' : ''}" font-size="${o.s || 11}" text-anchor="${a}" font-weight="${o.w || 500}"${m ? ' direction="ltr"' : ''}>${E(s)}</text>`;
}
const R = (x, y, w, h, k = '', r = 6) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="bx ${k}"/>`;
const L = (x1, y1, x2, y2, k = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ln ${k}"/>`;
const C = (x, y, r, k = '') => `<circle cx="${x}" cy="${y}" r="${r}" class="bx ${k}"/>`;
function A(x1, y1, x2, y2, k = '') {
  const a = Math.atan2(y2 - y1, x2 - x1), s = 6.5;
  const p = [[x2, y2], [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)]];
  return L(x1, y1, x2 - 3 * Math.cos(a), y2 - 3 * Math.sin(a), k) + `<polygon points="${p.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" class="ah ${k.replace('dash', '')}"/>`;
}
function wrap(s, n) {
  const w = String(s).split(' '), out = []; let cur = '';
  for (const x of w) { if ((cur + ' ' + x).trim().length > n && cur) { out.push(cur); cur = x; } else cur = (cur + ' ' + x).trim(); }
  if (cur) out.push(cur); return out;
}
function ML(x, y, s, n, o = {}) {
  const ls = wrap(s, n), lh = (o.s || 10) * 1.45, y0 = y - (ls.length - 1) * lh / 2;
  return ls.map((l, i) => T(x, y0 + i * lh + 3.5, l, o)).join('');
}
const OK = (x, y) => `<g class="mk ok"><circle cx="${x}" cy="${y}" r="9"/><path d="M${x - 4} ${y} l3 3 l5-6"/></g>`;
const NO = (x, y) => `<g class="mk bad"><circle cx="${x}" cy="${y}" r="9"/><path d="M${x - 3.5} ${y - 3.5} l7 7 M${x + 3.5} ${y - 3.5} l-7 7"/></g>`;
const inc = (a, v) => (a || []).includes(v);

/* ---------- الطبقات ---------- */
const TCP = [['التطبيق', 'Application', 'HTTP · DNS · DHCP', ''], ['النقل', 'Transport', 'TCP · UDP', 'Segment'], ['الإنترنت', 'Internet', 'IP · ICMP', 'Packet'], ['وصول الشبكة', 'Network Access', 'Ethernet · Wi-Fi', 'Frame']];
const OSI = [['التطبيق', 'Application', '', 'Data'], ['العرض', 'Presentation', '', 'Data'], ['الجلسة', 'Session', '', 'Data'], ['النقل', 'Transport', 'TCP · UDP', 'Segment'], ['الشبكة', 'Network', 'IP', 'Packet'], ['ربط البيانات', 'Data Link', 'MAC · Ethernet', 'Frame'], ['الفيزيائية', 'Physical', 'كابل · إشارة', 'Bits']];
function layers(s) {
  const D = s.m === 'osi' ? OSI : TCP, n = D.length, gap = n > 4 ? 4 : 8, h = (H - 16 - (n - 1) * gap) / n; let o = '';
  D.forEach((d, i) => {
    const y = 8 + i * (h + gap), hi = inc(s.hi, i), cy = y + h / 2 + 4, sz = n > 4 ? 11 : 13;
    o += R(8, y, 344, h, hi ? 'hi' : '');
    o += T(344, cy, d[0], { a: 'end', s: sz, w: 700, c: hi ? 'ok' : 'ink' });
    o += T(262, cy, d[1], { a: 'end', s: 9, m: 1, c: 'mut' });
    if (s.m === 'osi') o += T(18, cy, 'L' + (7 - i), { a: 'start', s: 9, m: 1, c: 'mut', w: 700 });
    if (d[2]) o += T(s.m === 'osi' ? 40 : 18, cy, d[2], { a: 'start', s: 9, m: 1, c: 'mut' });
    if (d[3]) { o += R(124, y + h / 2 - 8, 54, 16, hi ? 'solid' : 'acc', 8) + T(151, cy - .5, d[3], { s: 8.5, m: 1, c: hi ? 'on' : 'acc', w: 700 }); }
  });
  return o;
}

/* ---------- سلسلة خطوات ---------- */
function chain(s) {
  const it = s.items, n = it.length, gw = n > 4 ? 14 : 20, w = (344 - (n - 1) * gw) / n, h = s.h || 74, y = (H - h) / 2 + (s.title ? 10 : 0);
  let o = s.title ? T(180, 24, s.title, { c: 'mut', s: 11, w: 600 }) : '';
  it.forEach((d, i) => {
    const x = 8 + i * (w + gw), hi = inc(s.hi, i), cn = Math.floor(w / (n > 4 ? 5.6 : 6.3));
    o += R(x, y, w, h, hi ? 'hi' : '');
    const sz = n > 4 ? 10 : 11, l1 = wrap(d.t, cn).length, l2 = d.s ? wrap(d.s, cn + 2).length : 0, h1 = l1 * sz * 1.45, h2 = l2 * 13, tot = h1 + (l2 ? 6 + h2 : 0), top = y + h / 2 - tot / 2;
    o += ML(x + w / 2, top + h1 / 2, d.t, cn, { s: sz, w: 700, m: d.m, c: hi ? 'ok' : 'ink' });
    if (d.s) o += ML(x + w / 2, top + h1 + 6 + h2 / 2, d.s, cn + 2, { s: 9, c: 'mut' });
    if (i < n - 1) o += A(x + w + 3, y + h / 2, x + w + gw - 3, y + h / 2, hi || inc(s.hi, i + 1) ? 'hi' : '');
  });
  return o;
}

/* ---------- أنماط الإرسال ---------- */
function cast(s) {
  const ys = [34, 67, 100, 133, 166], rec = s.mode === 'uni' ? [2] : s.mode === 'multi' ? [0, 2, 4] : [0, 1, 2, 3, 4];
  const lab = { uni: 'إلى جهاز واحد · Unicast', multi: 'إلى مجموعة محددة · Multicast', broad: 'إلى الجميع · Broadcast' }[s.mode];
  let o = T(180, 16, lab, { s: 11, w: 700, c: 'mut' });
  o += C(46, 100, 22, 'acc') + T(46, 104, 'مرسل', { s: 10, w: 700, c: 'acc' });
  ys.forEach((y, i) => {
    const r = rec.includes(i);
    if (r) o += A(70, 100, 268, y, 'hi');
    o += R(272, y - 13, 60, 26, r ? 'hi' : 'dim', 5) + T(302, y + 4, r ? 'يستلم' : 'يتجاهل', { s: 10, w: 600, c: r ? 'ok' : 'mut' });
    if (!r) o += NO(344, y);
    else o += OK(344, y);
  });
  return o;
}

/* ---------- أنظمة العد ---------- */
function numconv(s) {
  const m = s.m; let o = '';
  const bitsRow = (bits, n, y, label) => {
    const cw = Math.min(32, 336 / n), x0 = (W - n * cw) / 2; let sum = [], tot = 0;
    o += T(180, 20, label, { s: 11, w: 700, c: 'mut' });
    for (let i = 0; i < n; i++) {
      const pv = 2 ** (n - 1 - i), on = bits[i] === '1', x = x0 + i * cw;
      o += T(x + cw / 2, y - 6, pv, { s: 9, m: 1, c: 'mut' });
      o += R(x + 1, y, cw - 2, 30, on ? 'hi' : '', 4) + T(x + cw / 2, y + 20, bits[i], { s: 14, m: 1, w: 700, c: on ? 'ok' : 'mut' });
      if (on) { sum.push(pv); tot += pv; }
    }
    return { sum, tot };
  };
  if (m === 'bin2dec') {
    const n = s.v.length, r = bitsRow(s.v, n, 52, 'ثنائي ← عشري: اجمع قيم الخانات المضاءة');
    o += T(180, 118, r.sum.join(' + '), { s: 13, m: 1, w: 600 });
    o += R(110, 134, 140, 38, 'solid', 8) + T(180, 160, '= ' + r.tot, { s: 20, m: 1, w: 700, c: 'on' });
  } else if (m === 'dec2bin') {
    const n = s.n || 8, bits = (+s.v).toString(2).padStart(n, '0'), r = bitsRow(bits, n, 52, 'عشري ← ثنائي: اطرح أكبر قيمة تناسب ثم كرر');
    o += T(180, 118, s.v + ' = ' + r.sum.join(' + '), { s: 12, m: 1, w: 600 });
    o += R(60, 134, 240, 38, 'solid', 8) + T(180, 160, bits, { s: 18, m: 1, w: 700, c: 'on' });
  } else if (m === 'hex2dec') {
    const d = s.v.split(''), n = d.length, bw = 70, gw = 40, x0 = (W - (n * bw + (n - 1) * gw)) / 2; let tot = 0, parts = [];
    o += T(180, 20, 'ست عشري ← عشري: كل خانة × 16 أُس موقعها', { s: 11, w: 700, c: 'mut' });
    d.forEach((c, i) => {
      const v = parseInt(c, 16), pw = 16 ** (n - 1 - i), x = x0 + i * (bw + gw); tot += v * pw; parts.push(v * pw);

function seqd(a, b, m, hi) { return { t: 'seq', a, b, msgs: m.map(([d, t]) => ({ d, t })), hi }; }

/* ===== تطبيق الصفحة ===== */
(function () {
  const CFG = window.CFG, KEY = CFG.key;
  const $ = (s, r = document) => r.querySelector(s);
  const st = { mode: 'test', topic: 'all', text: '', unl: false, known: new Set(), pick: {}, rev: new Set() };
  try { JSON.parse(localStorage.getItem(KEY + '-known') || '[]').forEach(i => st.known.add(i)); } catch (e) {}
  try { const t = localStorage.getItem(KEY + '-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY + '-known', JSON.stringify([...st.known])); } catch (e) {} };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const norm = s => String(s).toLowerCase();
  const pad = n => String(n).padStart(3, '0');
  const LET = 'ABCDE';
  const hasO = x => Array.isArray(x.o) && x.o.length;

  const counts = {}; Q.forEach(x => counts[x.topic] = (counts[x.topic] || 0) + 1);

  function visible() {
    const t = norm(st.text.trim());
    return Q.filter(x => (st.topic === 'all' || x.topic === st.topic)
      && (!st.unl || !st.known.has(x.id))
      && (!t || norm([x.id, x.en, x.ar, x.tip, x.why, (x.o||[]).join(' '), (x.ans||[]).join(' ')].join(' ')).includes(t)));
  }
  const isRevealed = x => st.mode === 'review' || st.rev.has(x.id);
  const sameSet = (a, b) => a.length === b.length && a.every(v => b.includes(v));

  function card(x) {
    const rev = isRevealed(x), pk = st.pick[x.id] || [], test = st.mode === 'test';
    const opts = !hasO(x) ? '' : x.o.map((t, i) => {
      const ok = x.a.includes(i), picked = pk.includes(i);
      let cls = 'op'; if (rev && ok) cls += ' is-ok'; else if (rev && picked) cls += ' is-no'; else if (picked) cls += ' pick';
      const stt = rev ? (ok ? 'صحيحة' : (picked ? 'خطأ' : '')) : '';
      return `<li><button type="button" class="${cls}" data-id="${x.id}" data-i="${i}" ${(!test || rev) ? 'disabled' : ''}><span class="jack">${LET[i]}</span><span class="tx">${esc(t)}</span><span class="st">${stt}</span></button></li>`;
    }).join('');
    let verdict = '';
    if (test && rev && pk.length && x.a) verdict = sameSet(pk, x.a) ? '<span class="verdict good">إجابتك صحيحة</span>' : '<span class="verdict badv">إجابتك غير صحيحة، راجع الخلاصة</span>';
    const multi = (x.a||[]).length > 1 ? ` · اختر ${x.a.length}` : '';
    const known = st.known.has(x.id);
    return `<article class="u ${rev ? 'rev' : 'veil'}" id="q${x.id}" data-known="${known ? 1 : 0}">
      <div class="ear"><div class="no"><small>${CFG.q || 'Q'}</small>${pad(x.id)}</div><i class="led" title="${known ? 'محفوظ' : 'غير محفوظ'}"></i></div>
      <div class="body">
        <header class="qh"><span class="topic">${TOPICS[x.topic]}${multi}</span>
          <p class="q-en" dir="ltr">${esc(x.en)}</p><p class="q-ar">${esc(x.ar)}</p></header>
        <div class="cols">
          <div class="lcol">${hasO(x) ? `<ul class="opts" style="list-style:none;margin:0;padding:0;display:grid;gap:8px">${opts}</ul>` : `<div class="ans"><span class="lab">الإجابة الصحيحة</span><div class="chs">${x.ans.map(a => `<span class="ch" dir="ltr">${esc(a)}</span>`).join('')}</div></div>`}${x.note ? `<div class="note"><b>تنبيه:</b> ${esc(x.note)}</div>` : ''}</div>
          <figure class="dg"><div class="screen">${diagram(x.d)}<div class="veil-note"><span>يظهر الرسم بعد الإجابة</span></div></div>${x.d.cap ? `<figcaption>${esc(x.d.cap)}</figcaption>` : ''}</figure>
        </div>
        <div class="tip"><span class="tag">خلاصة ذهنية</span><p>${esc(x.tip)}</p></div>
        <p class="why"><b>الشرح:</b> ${esc(x.why)}</p>
        <div class="foot">
          ${test && !rev ? `<button type="button" class="btn primary" data-act="reveal" data-id="${x.id}">أظهر الإجابة</button>` : ''}
          ${test && rev ? `<button type="button" class="btn" data-act="retry" data-id="${x.id}">أعد المحاولة</button>` : ''}
          <button type="button" class="btn learn" data-act="learn" data-id="${x.id}" aria-pressed="${known}"><i></i>${known ? 'حفظتها' : 'علّمها كمحفوظة'}</button>
          ${verdict}
        </div>
      </div></div></article>`;
  }

  function stats() {
    const n = st.known.size, tot = Q.length;
    $('#mKnown').textContent = n; $('#mBar').style.width = (n / tot * 100) + '%'; $('#mTot').textContent = tot;
    const v = visible();
    let ro = `المعروض <b>${v.length}</b> من ${tot}`;
    if (st.mode === 'test') {
      const ans = Q.filter(x => hasO(x) && st.rev.has(x.id) && (st.pick[x.id] || []).length), okc = ans.filter(x => sameSet(st.pick[x.id], x.a)).length;
      ro += ` · نتيجتك <b>${okc}</b> / ${ans.length}`;
    }
    $('#readout').innerHTML = ro;
  }

  function chips() {
    const all = [['all', 'الكل', Q.length], ...Object.keys(TOPICS).map(k => [k, TOPICS[k], counts[k] || 0])];
    $('#chips').innerHTML = all.map(([k, t, c]) => `<button type="button" class="chip" data-topic="${k}" aria-pressed="${st.topic === k}">${t}<em>${c}</em></button>`).join('');
  }

  function render() {
    const v = visible();
    $('#list').innerHTML = v.length ? v.map(card).join('') : '<div class="empty">لا توجد أسئلة مطابقة. غيّر البحث أو المحور.</div>';
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === st.mode));
    $('#unl').setAttribute('aria-pressed', st.unl);
    chips(); stats();
  }

  function rerenderCard(id) {
    const x = Q.find(z => z.id === id), el = $('#q' + id); if (!x || !el) return render();
    el.outerHTML = card(x); stats();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mode) { st.mode = b.dataset.mode; st.rev.clear(); st.pick = {}; render(); return; }
    if (b.dataset.topic) { st.topic = b.dataset.topic; render(); return; }
    if (b.id === 'unl') { st.unl = !st.unl; render(); return; }
    if (b.id === 'theme') {
      const cur = document.documentElement.dataset.theme, dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      const nx = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; try { localStorage.setItem(KEY + '-theme', nx); } catch (er) {} return;
    }
    if (b.id === 'top') { scrollTo({ top: 0 }); return; }
    const id = +b.dataset.id; if (!id) return;
    const x = Q.find(z => z.id === id);
    if (b.dataset.act === 'learn') { st.known.has(id) ? st.known.delete(id) : st.known.add(id); save(); if (st.unl) render(); else rerenderCard(id); return; }
    if (b.dataset.act === 'reveal') { st.rev.add(id); rerenderCard(id); return; }
    if (b.dataset.act === 'retry') { st.rev.delete(id); delete st.pick[id]; rerenderCard(id); return; }
    if (b.classList.contains('op') && st.mode === 'test' && !st.rev.has(id) && x.a) {
      const i = +b.dataset.i, pk = st.pick[id] || [];
      if (x.a.length === 1) st.pick[id] = [i];
      else st.pick[id] = pk.includes(i) ? pk.filter(v => v !== i) : [...pk, i];
      if (st.pick[id].length === x.a.length) st.rev.add(id);
      rerenderCard(id);
    }
  });
  $('#search').addEventListener('input', e => { st.text = e.target.value; render(); });

  /* وضع الأسئلة المتعددة الإجابات: تمثيل نصي للعدد */
  /* LEDs في الواجهة */
  $('#leds').innerHTML = Array.from({ length: 24 }, (_, i) => `<i class="${i % 7 === 3 ? 'o' : (i % 3 === 0 || i % 5 === 1) ? 'on' : ''}"></i>`).join('');
  render();
})();
</script></body></html>
